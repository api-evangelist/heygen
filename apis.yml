aid: heygen
name: HeyGen
description: >-
  HeyGen is an AI video generation platform that creates studio-quality
  avatar videos, voice clones, and translated video content from simple
  text prompts. The product line includes Avatar V (digital twins), Photo
  Avatar, Avatar IV, the Starfish text-to-speech engine, the Video Agent
  API, Video Translation, and Lipsync. HeyGen serves sales, marketing,
  e-learning, and localization teams with both self-serve pay-as-you-go
  API access (starting at a $5 minimum) and enterprise contracts. The
  company is SOC 2 Type II and GDPR compliant and has powered 50M+
  generated videos.
